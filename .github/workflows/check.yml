name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y libreoffice-writer fonts-noto-cjk
      - run: npm ci
      - run: npm run check
      - name: Refuse private runtime files in Git
        run: |
          if git ls-files | grep -E '(^|/)(private-data|backups|exports)/|\.(sqlite|db|key|pem)(-|$)|(^|/)\.env$'; then
            echo 'Private runtime path tracked by Git'
            exit 1
          fi
